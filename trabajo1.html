<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estructura Basica HTML</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }
        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
        nav {
            background-color: lightgray;
            padding: 10px;
            text-align: center;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        section {
            padding: 20px;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi pagina Layout</h1>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Nosotros</a>
        <a href="#">sofia</a>
    </nav>

    <section>
        <h2>Bienvenido</h2>
        <article>
            <h3>explicando que es</h3>
            <p>Este es el texto explicativo de mi articulo principal usando etiquetas semanticas.</p>
        </article>
    </section>

    <footer>
        <p>Creado por mi  - 2026</p>
    </footer>

</body>
</html>

            padding: 20px;

        }

        .seccion-principal {
            display: flex;
        }
        aside {
            background-color: #f2f2f2;
            width: 30%;
            padding: 15px;

        main {
            background-color: #ffffff;
            width: 70%;
            padding: 15px;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
